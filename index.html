<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Noc Nietoperzy</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
  :root { --sab: env(safe-area-inset-bottom, 0px); --sat: env(safe-area-inset-top, 0px); }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #000;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* =========================================================================
   NOC NIETOPERZY — FPP, układ pionowy, stała pozycja gracza.
   Broń: czosnek (rzut po łuku, ograniczona amunicja) i dzida (tylko z bliska).
   Wszystko czarno-białe, tylko ugryzienie jest czerwone. 10 ugryzień = śmierć.
   ========================================================================= */

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const FONT = "'Pirata One', 'UnifrakturMaguntia', Georgia, serif";
const FONT_TITLE = "'UnifrakturMaguntia', 'Pirata One', Georgia, serif";

// ---------- Konfiguracja ----------
const CFG = {
  maxHealth: 10,
  gravity: 9.8,
  garlicSpeed: 19,
  garlicRadius: 0.09,
  maxAmmo: 10,             // maksymalnie główek czosnku
  ammoRegen: 1.5,          // co ile sekund przybywa 1 czosnek
  hand: { x: 0.16, y: -0.42, z: 0.25 },
  spawnZ: 42,
  hoverZ: 1.15,
  lungeZ: 0.5,
  lungeTime: 0.24,
  biteMin: 0.5, biteMax: 0.8,
  batHitRadius: 0.36,
  spearRange: 4.2,         // dzida sięga tylko bliskich nietoperzy
  spearTime: 0.26,         // czas pchnięcia
  aspect: 9 / 16,          // układ pionowy
};

// ---------- Ekran / projekcja ----------
let W = 0, H = 0, DPR = 1, F = 1, CX = 0, CY = 0;
let bgCanvas = null;
let UI = {};

function cssPx(name) {
  const v = getComputedStyle(document.documentElement).getPropertyValue(name);
  return parseFloat(v) || 0;
}

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const vw = window.innerWidth, vh = window.innerHeight;
  H = vh;
  W = Math.min(vw, Math.round(vh * CFG.aspect));
  if (vw / vh < CFG.aspect) W = vw;           // telefon w pionie: cała szerokość
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  F = Math.min(W, H) * 0.95;
  CX = W / 2; CY = H * 0.46;

  // układ interfejsu
  const pad = 12;
  const sab = cssPx('--sab'), sat = cssPx('--sat');
  const bh = clamp(H * 0.075, 50, 72);
  const by = H - bh - pad - sab;
  const bw = (W - pad * 3) / 2;
  UI = {
    pad, top: pad + sat,
    btnL: { x: pad, y: by, w: bw, h: bh },
    btnR: { x: pad * 2 + bw, y: by, w: bw, h: bh },
    hp: { x: pad, y: by - 32, w: W - pad * 2, h: 14 },
  };
  UI.playBottom = UI.hp.y - 22; // poniżej tej linii dotyk nie atakuje

  buildBackground();
  buildClouds();
}

function project(x, y, z) {
  return { x: CX + (x / z) * F, y: CY - (y / z) * F, s: F / z };
}

// ---------- Pomocnicze ----------
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
function seeded(seed) {
  let s = seed >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}
// Dobiera rozmiar czcionki tak, by tekst zmieścił się w szerokości
function fitFont(text, maxSize, maxWidth, family = FONT) {
  let size = maxSize;
  ctx.font = size + 'px ' + family;
  const w = ctx.measureText(text).width;
  if (w > maxWidth) size = Math.floor(size * maxWidth / w);
  ctx.font = size + 'px ' + family;
  return size;
}

// ---------- Tło (prerender, potem zamiana na czerń i biel) ----------
function buildBackground() {
  bgCanvas = document.createElement('canvas');
  bgCanvas.width = Math.round(W * DPR); bgCanvas.height = Math.round(H * DPR);
  const g = bgCanvas.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const R = seeded(1337);
  const horizon = H * 0.56;

  const sky = g.createLinearGradient(0, 0, 0, horizon);
  sky.addColorStop(0, '#000000');
  sky.addColorStop(0.5, '#0a0a10');
  sky.addColorStop(1, '#2a2a30');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);

  // Gwiazdy
  const starCount = Math.round(W * H / 3000);
  for (let i = 0; i < starCount; i++) {
    const x = R() * W, y = Math.pow(R(), 1.5) * horizon;
    const r = R() < 0.05 ? 1.3 : R() * 0.8 + 0.2;
    g.globalAlpha = 0.2 + R() * 0.7 * (1 - y / horizon);
    g.fillStyle = '#fff';
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }
  g.globalAlpha = 1;

  // Księżyc
  const mr = Math.min(W, H) * 0.13, mx = W * 0.7, my = H * 0.13;
  const glow = g.createRadialGradient(mx, my, mr * 0.8, mx, my, mr * 5);
  glow.addColorStop(0, 'rgba(255,255,255,0.28)');
  glow.addColorStop(0.35, 'rgba(200,200,200,0.07)');
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = glow; g.fillRect(0, 0, W, H);
  const mg = g.createRadialGradient(mx - mr * 0.3, my - mr * 0.3, mr * 0.1, mx, my, mr);
  mg.addColorStop(0, '#f4f4f4'); mg.addColorStop(0.75, '#cfcfcf'); mg.addColorStop(1, '#a8a8a8');
  g.fillStyle = mg;
  g.beginPath(); g.arc(mx, my, mr, 0, Math.PI * 2); g.fill();
  g.save();
  g.beginPath(); g.arc(mx, my, mr, 0, Math.PI * 2); g.clip();
  for (const [cx, cy, cr] of [[-0.3, -0.2, 0.22], [0.25, 0.1, 0.16], [-0.05, 0.38, 0.13], [0.35, -0.35, 0.09], [-0.45, 0.25, 0.1], [0.05, -0.05, 0.07]]) {
    g.fillStyle = 'rgba(90,90,90,0.35)';
    g.beginPath(); g.arc(mx + cx * mr, my + cy * mr, cr * mr, 0, Math.PI * 2); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.2)';
    g.beginPath(); g.arc(mx + cx * mr + cr * mr * 0.2, my + cy * mr + cr * mr * 0.2, cr * mr * 0.7, 0, Math.PI * 2); g.fill();
  }
  g.restore();

  // Góry
  const layers = [
    { base: horizon - H * 0.13, amp: H * 0.12, color: '#26262a', freq: 0.8, seed: 3 },
    { base: horizon - H * 0.06, amp: H * 0.09, color: '#18181b', freq: 1.3, seed: 7 },
    { base: horizon - H * 0.01, amp: H * 0.05, color: '#0e0e10', freq: 2.0, seed: 11 },
  ];
  let castleSpot = null;
  layers.forEach((L, li) => {
    const r = seeded(L.seed * 977);
    const ph = [r() * 10, r() * 10, r() * 10, r() * 10];
    const ridge = (x) => {
      const u = x / W * Math.PI * 2 * L.freq;
      const v = 0.55 * (1 - Math.abs(Math.sin(u * 0.8 + ph[0])))
              + 0.30 * (1 - Math.abs(Math.sin(u * 1.9 + ph[1])))
              + 0.12 * Math.sin(u * 5.3 + ph[2])
              + 0.05 * Math.sin(u * 13.7 + ph[3]);
      return L.base - v * L.amp;
    };
    g.fillStyle = L.color;
    g.beginPath(); g.moveTo(0, H);
    let best = { x: 0, y: H };
    for (let x = 0; x <= W + 3; x += 3) {
      const y = ridge(x) + (r() - 0.5) * 1.5;
      g.lineTo(x, y);
      if (li === 1 && x > W * 0.15 && x < W * 0.55 && y < best.y) best = { x, y };
    }
    g.lineTo(W, H); g.closePath(); g.fill();
    g.strokeStyle = li === 0 ? 'rgba(220,220,220,0.22)' : 'rgba(200,200,200,0.1)';
    g.lineWidth = 1;
    g.beginPath();
    for (let x = 0; x <= W + 3; x += 3) { const y = ridge(x); x === 0 ? g.moveTo(x, y) : g.lineTo(x, y); }
    g.stroke();
    if (li === 1) castleSpot = best;
    const mist = g.createLinearGradient(0, L.base - L.amp * 0.2, 0, horizon + 10);
    mist.addColorStop(0, 'rgba(160,160,160,0)');
    mist.addColorStop(1, 'rgba(160,160,160,0.08)');
    g.fillStyle = mist; g.fillRect(0, L.base - L.amp * 0.3, W, horizon - L.base + L.amp);
  });

  if (castleSpot) drawCastle(g, castleSpot.x, castleSpot.y + 2, Math.min(W, H) * 0.0013);

  // Las
  const rows = [
    { y: horizon - H * 0.004, h: H * 0.05, color: '#0b0b0d', gap: 0.35 },
    { y: horizon + H * 0.03, h: H * 0.08, color: '#08080a', gap: 0.4 },
    { y: horizon + H * 0.08, h: H * 0.12, color: '#050506', gap: 0.45 },
    { y: horizon + H * 0.16, h: H * 0.18, color: '#020203', gap: 0.5 },
  ];
  rows.forEach((row, ri) => {
    const r = seeded(100 + ri * 31);
    g.fillStyle = row.color;
    g.fillRect(0, row.y, W, H - row.y);
    let x = -row.h * 0.3;
    while (x < W + row.h * 0.3) {
      const th = row.h * (0.6 + r() * 0.6);
      const tw = th * (0.28 + r() * 0.12);
      drawPine(g, x, row.y + row.h * 0.1 * r(), tw, th, r);
      x += tw * (row.gap + r() * 0.5);
    }
    const fog = g.createLinearGradient(0, row.y - row.h, 0, row.y + row.h * 0.3);
    fog.addColorStop(0, 'rgba(150,150,150,0)');
    fog.addColorStop(0.7, 'rgba(150,150,150,' + (0.07 - ri * 0.014) + ')');
    fog.addColorStop(1, 'rgba(150,150,150,0)');
    g.fillStyle = fog; g.fillRect(0, row.y - row.h, W, row.h * 1.3);
  });

  // Mocna winieta
  const vig = g.createRadialGradient(W / 2, H * 0.4, Math.min(W, H) * 0.25, W / 2, H * 0.45, Math.max(W, H) * 0.75);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.75)');
  g.fillStyle = vig; g.fillRect(0, 0, W, H);

  // Czerń i biel + przyciemnienie
  const img = g.getImageData(0, 0, bgCanvas.width, bgCanvas.height);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    let l = (0.3 * d[i] + 0.59 * d[i + 1] + 0.11 * d[i + 2]) / 255;
    l = Math.pow(l, 1.2) * 255;
    d[i] = d[i + 1] = d[i + 2] = l;
  }
  g.putImageData(img, 0, 0);
}

function drawPine(g, x, baseY, w, h, r) {
  const tiers = 5;
  g.beginPath();
  g.moveTo(x, baseY - h);
  for (let i = 1; i <= tiers; i++) {
    const t = i / tiers, yy = baseY - h + h * t * 0.92;
    const ww = w * (0.25 + 0.75 * t) * (0.9 + r() * 0.2);
    g.lineTo(x + ww * 0.5, yy);
    if (i < tiers) g.lineTo(x + ww * 0.22, yy - h * 0.04);
  }
  g.lineTo(x + w * 0.06, baseY);
  g.lineTo(x - w * 0.06, baseY);
  for (let i = tiers; i >= 1; i--) {
    const t = i / tiers, yy = baseY - h + h * t * 0.92;
    const ww = w * (0.25 + 0.75 * t) * (0.9 + r() * 0.2);
    if (i < tiers) g.lineTo(x - ww * 0.22, yy - h * 0.04);
    g.lineTo(x - ww * 0.5, yy);
  }
  g.closePath();
  g.fill();
}

function drawCastle(g, x, y, s) {
  g.save();
  g.translate(x, y);
  g.scale(s * 40, s * 40);
  g.fillStyle = '#08080a';
  g.fillRect(-1.6, -1.2, 3.2, 1.3);
  for (let i = -1.6; i < 1.6; i += 0.32) g.fillRect(i, -1.42, 0.18, 0.24);
  const tower = (tx, tw, th) => {
    g.fillRect(tx - tw / 2, -th, tw, th);
    g.beginPath();
    g.moveTo(tx - tw * 0.7, -th); g.lineTo(tx, -th - tw * 1.8); g.lineTo(tx + tw * 0.7, -th);
    g.closePath(); g.fill();
  };
  tower(-1.5, 0.55, 2.0); tower(1.45, 0.5, 1.8); tower(0.2, 0.7, 2.9); tower(-0.55, 0.4, 2.2);
  g.fillStyle = '#d8d8d8';
  g.shadowColor = '#ffffff'; g.shadowBlur = 5;
  g.fillRect(0.12, -2.3, 0.14, 0.22);
  g.fillRect(-1.55, -1.5, 0.1, 0.16);
  g.restore();
}

// ---------- Chmury ----------
let clouds = [];
function buildClouds() {
  clouds = [];
  const R = seeded(42);
  for (let i = 0; i < 5; i++) {
    const c = document.createElement('canvas');
    const cw = Math.round(W * (0.6 + R() * 0.5)), ch = Math.round(cw * 0.25);
    c.width = cw; c.height = ch;
    const g = c.getContext('2d');
    for (let k = 0; k < 14; k++) {
      const ex = cw * (0.15 + R() * 0.7), ey = ch * (0.4 + R() * 0.3);
      const er = ch * (0.15 + R() * 0.3);
      const gr = g.createRadialGradient(ex, ey, 0, ex, ey, er);
      gr.addColorStop(0, 'rgba(150,150,150,0.14)');
      gr.addColorStop(1, 'rgba(150,150,150,0)');
      g.fillStyle = gr;
      g.beginPath(); g.ellipse(ex, ey, er * 2.2, er, 0, 0, Math.PI * 2); g.fill();
    }
    clouds.push({ img: c, x: R() * W - cw / 2, y: H * (0.03 + R() * 0.28), v: 3 + R() * 6 });
  }
}
function drawClouds(dt) {
  for (const c of clouds) {
    c.x += c.v * dt;
    if (c.x > W + 50) c.x = -c.img.width - 50;
    ctx.drawImage(c.img, c.x, c.y);
  }
}

// ---------- Dźwięk ----------
let AC = null, noiseBuf = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function noise(dur, type, f0, f1, vol) {
  if (!AC) return;
  const t = AC.currentTime;
  const src = AC.createBufferSource(); src.buffer = noiseBuf;
  const flt = AC.createBiquadFilter(); flt.type = type;
  flt.frequency.setValueAtTime(f0, t);
  flt.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const gn = AC.createGain();
  gn.gain.setValueAtTime(vol, t);
  gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(flt); flt.connect(gn); gn.connect(AC.destination);
  src.start(t); src.stop(t + dur);
}
function tone(f0, f1, dur, vol, type = 'sine') {
  if (!AC) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const gn = AC.createGain();
  gn.gain.setValueAtTime(vol, t);
  gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(gn); gn.connect(AC.destination);
  o.start(t); o.stop(t + dur);
}
const sfx = {
  throw: () => noise(0.12, 'bandpass', 600, 2500, 0.12),
  empty: () => tone(900, 600, 0.05, 0.08, 'square'),
  thrust: () => noise(0.16, 'bandpass', 300, 1800, 0.25),
  hit: () => { noise(0.2, 'lowpass', 1600, 150, 0.45); tone(180, 60, 0.15, 0.25, 'triangle'); tone(3000, 1200, 0.15, 0.04, 'square'); },
  stab: () => { noise(0.1, 'highpass', 2000, 600, 0.3); tone(140, 50, 0.2, 0.35, 'triangle'); },
  squeak: () => tone(rand(2600, 3400), rand(1800, 2200), 0.08, 0.04, 'square'),
  bite: () => { tone(120, 40, 0.25, 0.6, 'sawtooth'); noise(0.15, 'highpass', 3000, 900, 0.35); },
  death: () => tone(300, 40, 1.2, 0.4, 'sawtooth'),
  select: () => tone(500, 700, 0.06, 0.08, 'triangle'),
};

// ---------- Stan gry ----------
let state = 'menu';
let bats = [], garlics = [], particles = [], floaters = [];
let health, score, elapsed, spawnTimer, flash, shake, overTime, thrown, best = 0;
let weapon = 'garlic', ammo, ammoTimer, spear, ammoBlink = 0;
try { best = +localStorage.getItem('nocNietoperzyBest') || 0; } catch (e) {}

function resetGame() {
  bats = []; garlics = []; particles = []; floaters = [];
  health = CFG.maxHealth; score = 0; elapsed = 0; spawnTimer = 0.6;
  flash = 0; shake = 0; thrown = 0;
  ammo = CFG.maxAmmo; ammoTimer = 0;
  spear = { t: 1, x: 0, y: 0 };
  weapon = 'garlic';
}
resetGame();

function difficulty() {
  const t = elapsed;
  return {
    interval: Math.max(0.2, 1 / (1 + t / 25)),
    speed: Math.min(12, 5.5 + t * 0.04),
  };
}

// ---------- Nietoperze ----------
function spawnBat() {
  const d = difficulty();
  const z0 = CFG.spawnZ * rand(0.85, 1.1);
  const b = {
    x0: rand(-11, 11), y0: rand(0.5, 9), z0,
    tx: rand(-0.32, 0.32), ty: rand(-0.6, 0.45),
    x: 0, y: 0, z: z0, vx: 0, vy: 0, vz: 0,
    speed: d.speed * rand(0.8, 1.2),
    size: rand(0.9, 1.15),
    flap: rand(0, Math.PI * 2), flapSpeed: rand(15, 20),
    wobA: rand(0.4, 1.3), wobF: rand(1.2, 2.5), wobP: rand(0, 6.28),
    state: 'fly', biteT: 0, lunge: 0, mouth: 0, tilt: 0, rot: 0, spin: 0,
    alpha: 1, mark: null, squeaked: false,
  };
  b.x = b.x0; b.y = b.y0;
  bats.push(b);
}

function updateBat(b, dt) {
  const px = b.x, py = b.y, pz = b.z;
  b.flap += b.flapSpeed * dt;
  if (b.state === 'fly') {
    b.z -= b.speed * dt * (b.z < 6 ? 0.75 : 1);
    const p = clamp(1 - (b.z - CFG.hoverZ) / (b.z0 - CFG.hoverZ), 0, 1);
    const e = p * p * (3 - 2 * p);
    const wob = Math.min(1, (b.z - CFG.hoverZ) / 8);
    b.x = lerp(b.x0, b.tx, e) + Math.sin(elapsed * b.wobF + b.wobP) * b.wobA * wob;
    b.y = lerp(b.y0, b.ty, e) + Math.cos(elapsed * b.wobF * 1.3 + b.wobP) * b.wobA * 0.5 * wob + Math.sin(b.flap) * 0.04;
    b.mouth = clamp((7 - b.z) / 5, 0, 0.55);
    if (!b.squeaked && b.z < 8) { b.squeaked = true; sfx.squeak(); }
    if (b.z <= CFG.hoverZ) { b.z = CFG.hoverZ; b.state = 'attack'; b.biteT = rand(0.35, 0.6); }
  } else if (b.state === 'attack') {
    b.biteT -= dt;
    b.lunge = clamp(1 - b.biteT / CFG.lungeTime, 0, 1);
    const l = b.lunge * b.lunge;
    b.z = lerp(CFG.hoverZ, CFG.lungeZ, l);
    b.x = b.tx * lerp(1, 0.35, l) + Math.sin(elapsed * 3 + b.wobP) * 0.04;
    b.y = b.ty * lerp(1, 0.4, l) + Math.sin(b.flap) * 0.03 - l * 0.05;
    b.mouth = Math.max(0.55, b.lunge);
    if (b.biteT <= 0) { bite(); b.biteT = rand(CFG.biteMin, CFG.biteMax); b.lunge = 0; }
  } else if (b.state === 'dead') {
    b.vy -= CFG.gravity * dt;
    b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
    b.rot += b.spin * dt;
    b.mouth = 0.3;
    b.alpha -= dt * 0.6;
    return;
  }
  if (dt > 0) { b.vx = (b.x - px) / dt; b.vy = (b.y - py) / dt; b.vz = (b.z - pz) / dt; }
  b.tilt = clamp(b.vx * 0.04, -0.4, 0.4);
}

function bite() {
  if (state !== 'play') return;
  health--;
  flash = 1; shake = 1;
  sfx.bite();
  if (health <= 0) gameOver();
}

function killBat(b, how, vx, vy, vz) {
  b.state = 'dead';
  b.mark = how;
  b.vx = vx * 0.15 + rand(-1, 1);
  b.vy = Math.max(1, vy * 0.1) + rand(0.5, 2);
  b.vz = Math.max(0.5, vz * 0.2);
  b.spin = rand(-8, 8);
  score++;
  const p = project(b.x, b.y, b.z);
  const s = p.s;
  if (how === 'garlic') {
    sfx.hit();
    for (let i = 0; i < 22; i++) {
      const a = rand(0, Math.PI * 2), v = rand(0.4, 2) * s;
      particles.push({ x: p.x, y: p.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - s * 0.4,
        g: s * 4, r: rand(0.015, 0.04) * s, life: rand(0.4, 0.9), t: 0, c: Math.random() < 0.7 ? '#f2f0e8' : '#9a9a9a' });
    }
    // dym — nietoperze nie znoszą czosnku
    for (let i = 0; i < 8; i++) particles.push({ x: p.x + rand(-0.1, 0.1) * s, y: p.y, vx: rand(-0.3, 0.3) * s, vy: -rand(0.3, 0.8) * s,
      g: 0, r: rand(0.06, 0.12) * s, life: rand(0.6, 1.1), t: 0, c: '#6a6a6a', smoke: true });
  } else {
    sfx.stab();
    for (let i = 0; i < 18; i++) {
      const a = rand(0, Math.PI * 2), v = rand(0.3, 1.6) * s;
      particles.push({ x: p.x, y: p.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        g: s * 4, r: rand(0.01, 0.03) * s, life: rand(0.3, 0.7), t: 0, c: Math.random() < 0.5 ? '#000' : '#3a3a3a' });
    }
  }
}

// ---------- Czosnek ----------
function throwGarlic(sx, sy) {
  if (ammo <= 0) {
    sfx.empty(); ammoBlink = 1;
    floaters.push({ x: sx, y: sy, text: 'Brak czosnku!', t: 0 });
    return;
  }
  ammo--; thrown++;
  sfx.throw();
  const S = CFG.hand;
  let target = null, bestScore = Infinity;
  for (const b of bats) {
    if (b.state === 'dead') continue;
    const p = project(b.x, b.y, b.z);
    const r = p.s * 0.5 * b.size * 0.75 + 24;
    const d = Math.hypot(p.x - sx, p.y - sy);
    if (d < r) {
      const sc = d / r + (b.state === 'attack' ? -0.3 : 0);
      if (sc < bestScore) { bestScore = sc; target = b; }
    }
  }
  let T, t;
  if (target) {
    const base = target.state === 'attack'
      ? { x: target.tx, y: target.ty, z: CFG.hoverZ }
      : { x: target.x, y: target.y, z: target.z };
    t = clamp(Math.hypot(base.x - S.x, base.y - S.y, base.z - S.z) / CFG.garlicSpeed, 0.09, 1.4);
    T = base;
    if (target.state !== 'attack') {
      for (let k = 0; k < 3; k++) {
        T = { x: base.x + target.vx * t, y: base.y + target.vy * t, z: Math.max(CFG.hoverZ, base.z + target.vz * t) };
        t = clamp(Math.hypot(T.x - S.x, T.y - S.y, T.z - S.z) / CFG.garlicSpeed, 0.09, 1.4);
      }
    }
  } else {
    const D = 18;
    T = { x: (sx - CX) / F * D, y: -(sy - CY) / F * D, z: D };
    t = Math.hypot(T.x - S.x, T.y - S.y, T.z - S.z) / CFG.garlicSpeed;
  }
  garlics.push({
    x: S.x, y: S.y, z: S.z,
    vx: (T.x - S.x) / t, vy: (T.y - S.y) / t + 0.5 * CFG.gravity * t, vz: (T.z - S.z) / t,
    rot: rand(0, 6.28), spin: rand(-12, 12), age: 0,
  });
}

function updateGarlics(dt) {
  const steps = 4, h = dt / steps;
  for (let i = garlics.length - 1; i >= 0; i--) {
    const gm = garlics[i];
    let hit = false;
    for (let s = 0; s < steps && !hit; s++) {
      gm.vy -= CFG.gravity * h;
      gm.x += gm.vx * h; gm.y += gm.vy * h; gm.z += gm.vz * h;
      for (const b of bats) {
        if (b.state === 'dead') continue;
        const rr = CFG.batHitRadius * b.size + CFG.garlicRadius;
        const dx = gm.x - b.x, dy = gm.y - b.y, dz = (gm.z - b.z) * 0.8;
        if (dx * dx + dy * dy + dz * dz < rr * rr) { killBat(b, 'garlic', gm.vx, gm.vy, gm.vz); hit = true; break; }
      }
    }
    gm.rot += gm.spin * dt;
    gm.age += dt;
    if (hit || gm.y < -4 || gm.z > 90 || gm.age > 5) garlics.splice(i, 1);
  }
}

// ---------- Dzida ----------
function thrustSpear(sx, sy) {
  if (spear.t < 0.75) return;          // jeszcze trwa poprzednie pchnięcie
  spear = { t: 0, x: sx, y: sy };
  sfx.thrust();
  let target = null, bestScore = Infinity, tooFar = false;
  for (const b of bats) {
    if (b.state === 'dead') continue;
    const p = project(b.x, b.y, b.z);
    const r = p.s * 0.5 * b.size * 0.8 + 22;
    const d = Math.hypot(p.x - sx, p.y - sy);
    if (d < r) {
      if (b.z > CFG.spearRange) { tooFar = true; continue; }
      const sc = b.z + d / r;
      if (sc < bestScore) { bestScore = sc; target = b; }
    }
  }
  if (target) {
    // trafienie w połowie pchnięcia
    setTimeout(() => { if (target.state !== 'dead' && state === 'play') killBat(target, 'spear', 0, 2, 3); }, CFG.spearTime * 400);
  } else if (tooFar) {
    floaters.push({ x: sx, y: sy, text: 'Za daleko!', t: 0 });
  }
}

// ---------- Rysowanie ----------
function drawBat(b) {
  if (b.z < 0.2) return;
  const p = project(b.x, b.y, b.z);
  const s = p.s * 0.5 * b.size;
  if (s < 1.5) { ctx.fillStyle = '#000'; ctx.fillRect(p.x - 1.5, p.y - 1, 3, 2); return; }
  const f = Math.sin(b.flap);
  ctx.save();
  ctx.globalAlpha = clamp(b.alpha, 0, 1);
  ctx.translate(p.x, p.y);
  ctx.rotate(b.tilt + b.rot);
  ctx.scale(s, s);

  const tipY = -0.55 * f, midY = -0.25 * f;
  for (const side of [-1, 1]) {
    ctx.save();
    ctx.scale(side, 1);
    const tip = [1.0, -0.1 + tipY], f1 = [0.72, 0.18 + midY * 0.7], f2 = [0.45, 0.26 + midY * 0.35], root = [0.13, 0.22];
    ctx.beginPath();
    ctx.moveTo(0.1, -0.12);
    ctx.quadraticCurveTo(0.45, -0.42 + midY * 1.2, tip[0], tip[1]);
    ctx.quadraticCurveTo((tip[0] + f1[0]) / 2 - 0.02, (tip[1] + f1[1]) / 2 - 0.02, f1[0], f1[1]);
    ctx.quadraticCurveTo((f1[0] + f2[0]) / 2, (f1[1] + f2[1]) / 2 - 0.1, f2[0], f2[1]);
    ctx.quadraticCurveTo((f2[0] + root[0]) / 2, (f2[1] + root[1]) / 2 - 0.1, root[0], root[1]);
    ctx.closePath();
    ctx.fillStyle = '#121212';
    ctx.fill();
    ctx.strokeStyle = 'rgba(210,210,210,0.35)';
    ctx.lineWidth = Math.max(0.012, 1 / s);
    ctx.stroke();
    if (s > 12) {
      ctx.strokeStyle = 'rgba(80,80,80,0.9)';
      ctx.lineWidth = Math.max(0.01, 0.8 / s);
      ctx.beginPath();
      ctx.moveTo(0.12, -0.1); ctx.lineTo(0.45, -0.3 + midY); ctx.lineTo(tip[0], tip[1]);
      ctx.moveTo(0.45, -0.3 + midY); ctx.lineTo(f1[0], f1[1]);
      ctx.moveTo(0.45, -0.3 + midY); ctx.lineTo(f2[0], f2[1]);
      ctx.stroke();
    }
    ctx.restore();
  }

  ctx.fillStyle = '#080808';
  ctx.beginPath(); ctx.ellipse(0, 0.06, 0.15, 0.24, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-0.15, -0.22); ctx.lineTo(-0.2, -0.48); ctx.lineTo(-0.04, -0.3);
  ctx.moveTo(0.15, -0.22); ctx.lineTo(0.2, -0.48); ctx.lineTo(0.04, -0.3);
  ctx.fill();
  ctx.beginPath(); ctx.arc(0, -0.16, 0.18, 0, Math.PI * 2); ctx.fill();
  if (s > 10) {
    ctx.strokeStyle = 'rgba(210,210,210,0.25)';
    ctx.lineWidth = Math.max(0.01, 1 / s);
    ctx.beginPath(); ctx.arc(0, -0.16, 0.18, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  }

  // Oczy — blade, świecące
  const eyeR = 0.028;
  for (const ex of [-0.07, 0.07]) {
    const gl = ctx.createRadialGradient(ex, -0.21, 0, ex, -0.21, eyeR * 3.5);
    gl.addColorStop(0, 'rgba(255,255,255,0.75)');
    gl.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(ex, -0.21, eyeR * 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(ex, -0.21, eyeR, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(ex, -0.21, eyeR * 0.3, eyeR * 0.85, 0, 0, Math.PI * 2); ctx.fill();
  }

  // Paszcza
  const m = b.mouth;
  if (m > 0.05 && s > 6) {
    const mx = 0, my = -0.09;
    const rw = 0.06 + 0.07 * m, rh = 0.012 + 0.09 * m;
    ctx.fillStyle = '#2b2b2b';
    ctx.beginPath(); ctx.ellipse(mx, my + rh * 0.4, rw, rh, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(mx, my + rh * 0.55, rw * 0.7, rh * 0.65, 0, 0, Math.PI * 2); ctx.fill();
    if (m > 0.4) {
      ctx.fillStyle = '#4a4a4a';
      ctx.beginPath(); ctx.ellipse(mx, my + rh * 1.0, rw * 0.45, rh * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    }
    const top = my + rh * 0.4 - rh, bot = my + rh * 0.4 + rh;
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = Math.max(0.004, 0.6 / s);
    const fang = 0.035 + 0.06 * m;
    for (const fx of [-0.6, 0.6]) {
      ctx.beginPath();
      ctx.moveTo(mx + fx * rw - 0.018, top + rh * 0.12);
      ctx.lineTo(mx + fx * rw, top + rh * 0.12 + fang);
      ctx.lineTo(mx + fx * rw + 0.018, top + rh * 0.12);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    for (const i of [-2, 0, 2]) {
      const tx = mx + (i / 3.4) * rw;
      ctx.beginPath();
      ctx.moveTo(tx - 0.01, top + rh * 0.18); ctx.lineTo(tx, top + rh * 0.18 + fang * 0.35); ctx.lineTo(tx + 0.01, top + rh * 0.18);
      ctx.closePath(); ctx.fill();
    }
    for (const fx of [-0.4, 0.4]) {
      ctx.beginPath();
      ctx.moveTo(mx + fx * rw - 0.014, bot - rh * 0.12);
      ctx.lineTo(mx + fx * rw, bot - rh * 0.12 - fang * 0.7);
      ctx.lineTo(mx + fx * rw + 0.014, bot - rh * 0.12);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  }

  if (b.mark === 'garlic') {
    ctx.fillStyle = 'rgba(235,232,220,0.85)';
    ctx.beginPath(); ctx.arc(0.02, -0.05, 0.13, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(-0.12, 0.05, 0.06, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0.13, -0.14, 0.05, 0, Math.PI * 2); ctx.fill();
  } else if (b.mark === 'spear') {
    ctx.strokeStyle = 'rgba(230,230,230,0.8)';
    ctx.lineWidth = 0.03;
    ctx.beginPath(); ctx.moveTo(-0.15, 0.15); ctx.lineTo(0.15, -0.05); ctx.stroke();
  }
  ctx.restore();
}

// Kształt główki czosnku (środek 0,0, promień r)
function garlicShape(c, r, rot = 0) {
  c.save();
  c.rotate(rot);
  const g = c.createRadialGradient(-r * 0.35, -r * 0.2, r * 0.1, 0, 0, r * 1.1);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.6, '#dedbd2'); g.addColorStop(1, '#6e6c66');
  c.fillStyle = g;
  c.beginPath();
  c.moveTo(0, -r * 1.25);
  c.bezierCurveTo(r * 0.25, -r * 0.9, r * 1.05, -r * 0.6, r * 1.0, r * 0.15);
  c.bezierCurveTo(r * 0.95, r * 0.85, -r * 0.95, r * 0.85, -r * 1.0, r * 0.15);
  c.bezierCurveTo(-r * 1.05, -r * 0.6, -r * 0.25, -r * 0.9, 0, -r * 1.25);
  c.fill();
  if (r > 4) {
    c.strokeStyle = 'rgba(90,88,80,0.6)';
    c.lineWidth = Math.max(0.6, r * 0.06);
    c.beginPath();
    for (const k of [-0.5, 0, 0.5]) {
      c.moveTo(0, -r * 1.05);
      c.quadraticCurveTo(r * k * 1.3, -r * 0.2, r * k * 0.9, r * 0.62);
    }
    c.stroke();
    c.fillStyle = '#8a877e';
    c.beginPath(); c.ellipse(0, r * 0.68, r * 0.3, r * 0.08, 0, 0, Math.PI * 2); c.fill();
  }
  c.restore();
}

function drawGarlic(gm) {
  if (gm.z < 0.15) return;
  const p = project(gm.x, gm.y, gm.z);
  const r = CFG.garlicRadius * p.s;
  if (p.y - r > H + 50) return;
  ctx.save();
  ctx.translate(p.x, p.y);
  if (r < 1.2) { ctx.fillStyle = '#e8e6dd'; ctx.fillRect(-1, -1, 2, 2); }
  else garlicShape(ctx, r, gm.rot);
  ctx.restore();
}

// Dzida trzymana w ręku / pchnięcie
function drawSpear(dt) {
  spear.t = Math.min(1, spear.t + dt / CFG.spearTime);
  const baseX = W * 0.86, baseY = H + H * 0.05;
  const restTip = { x: W * 0.58, y: UI.playBottom - H * 0.2 };
  let tipX = restTip.x, tipY = restTip.y;
  if (spear.t < 1) {
    const e = Math.sin(Math.PI * spear.t);
    tipX = lerp(restTip.x, spear.x, e);
    tipY = lerp(restTip.y, spear.y, e);
  }
  const ang = Math.atan2(tipY - baseY, tipX - baseX);
  const len = Math.hypot(tipX - baseX, tipY - baseY);
  const k = W / 400;
  ctx.save();
  ctx.translate(baseX, baseY);
  ctx.rotate(ang);
  // drzewce
  const wood = ctx.createLinearGradient(0, -8 * k, 0, 8 * k);
  wood.addColorStop(0, '#5a5a5a'); wood.addColorStop(0.5, '#2c2c2c'); wood.addColorStop(1, '#0c0c0c');
  ctx.fillStyle = wood;
  ctx.beginPath();
  ctx.moveTo(0, -9 * k); ctx.lineTo(len - 38 * k, -4 * k); ctx.lineTo(len - 38 * k, 4 * k); ctx.lineTo(0, 9 * k);
  ctx.closePath(); ctx.fill();
  // owijka
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(len - 46 * k, -5.5 * k, 10 * k, 11 * k);
  // grot
  const blade = ctx.createLinearGradient(0, -10 * k, 0, 10 * k);
  blade.addColorStop(0, '#f2f2f2'); blade.addColorStop(0.5, '#9a9a9a'); blade.addColorStop(1, '#3a3a3a');
  ctx.fillStyle = blade;
  ctx.beginPath();
  ctx.moveTo(len - 38 * k, -4 * k);
  ctx.quadraticCurveTo(len - 20 * k, -12 * k, len, 0);
  ctx.quadraticCurveTo(len - 20 * k, 12 * k, len - 38 * k, 4 * k);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(len - 36 * k, 0); ctx.lineTo(len - 3 * k, 0); ctx.stroke();
  ctx.restore();
}

function drawHeldGarlic() {
  if (ammo <= 0) return;
  const r = W * 0.06;
  ctx.save();
  ctx.translate(W * 0.8, UI.playBottom - r * 0.6);
  garlicShape(ctx, r, -0.3);
  ctx.restore();
}

// ---------- Cząsteczki i napisy ----------
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const q = particles[i];
    q.t += dt;
    q.vy += q.g * dt;
    q.x += q.vx * dt; q.y += q.vy * dt;
    if (q.smoke) q.r *= 1 + dt * 1.2;
    if (q.t > q.life) particles.splice(i, 1);
  }
  for (let i = floaters.length - 1; i >= 0; i--) {
    floaters[i].t += dt;
    if (floaters[i].t > 0.9) floaters.splice(i, 1);
  }
}
function drawParticles() {
  for (const q of particles) {
    ctx.globalAlpha = clamp(1 - q.t / q.life, 0, 1) * (q.smoke ? 0.35 : 1);
    ctx.fillStyle = q.c;
    ctx.beginPath(); ctx.arc(q.x, q.y, Math.max(1, q.r), 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  for (const f of floaters) {
    ctx.globalAlpha = clamp(1 - f.t / 0.9, 0, 1);
    const size = Math.min(26, W * 0.06);
    ctx.font = size + 'px ' + FONT;
    const tw = ctx.measureText(f.text).width;
    const x = clamp(f.x, tw / 2 + UI.pad, W - tw / 2 - UI.pad);
    ctx.fillStyle = '#000';
    ctx.fillText(f.text, x + 1.5, f.y - 20 - f.t * 30 + 1.5);
    ctx.fillStyle = '#e8e8e8';
    ctx.fillText(f.text, x, f.y - 20 - f.t * 30);
  }
  ctx.globalAlpha = 1;
}

// ---------- HUD ----------
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function formatTime(t) {
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return m + ':' + String(s).padStart(2, '0');
}

function drawButton(btn, selected, label, icon, blink) {
  ctx.save();
  roundRect(btn.x, btn.y, btn.w, btn.h, 10);
  ctx.fillStyle = selected ? 'rgba(235,235,235,0.16)' : 'rgba(0,0,0,0.65)';
  ctx.fill();
  ctx.lineWidth = selected ? 2.5 : 1.2;
  ctx.strokeStyle = blink > 0 ? 'rgba(255,255,255,' + (0.4 + 0.6 * Math.abs(Math.sin(blink * 20))) + ')'
                              : (selected ? '#e8e8e8' : 'rgba(160,160,160,0.5)');
  ctx.stroke();
  const ic = btn.h * 0.3;
  const iconX = btn.x + ic + 12;
  ctx.translate(iconX, btn.y + btn.h / 2);
  icon(ic);
  ctx.translate(-iconX, -(btn.y + btn.h / 2));
  const textX = iconX + ic + 10;
  const maxW = btn.x + btn.w - 10 - textX;
  const size = fitFont(label, Math.min(btn.h * 0.5, 30), maxW);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = selected ? '#ffffff' : '#9a9a9a';
  ctx.fillText(label, textX, btn.y + btn.h / 2 + size * 0.05);
  ctx.restore();
}

function drawHUD() {
  const { pad, top, hp } = UI;
  ctx.save();
  // pasek zdrowia
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  roundRect(hp.x - 3, hp.y - 3, hp.w + 6, hp.h + 6, 5); ctx.fill();
  const seg = hp.w / CFG.maxHealth;
  for (let i = 0; i < CFG.maxHealth; i++) {
    if (i < health) {
      const g = ctx.createLinearGradient(0, hp.y, 0, hp.y + hp.h);
      g.addColorStop(0, '#f0f0f0'); g.addColorStop(1, '#7a7a7a');
      ctx.fillStyle = g;
    } else ctx.fillStyle = 'rgba(60,60,60,0.45)';
    roundRect(hp.x + i * seg + 1.5, hp.y, seg - 3, hp.h, 2); ctx.fill();
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  fitFont('Zdrowie', 16, W - pad * 2);
  ctx.fillStyle = '#bdbdbd';
  ctx.fillText('Zdrowie', W / 2, hp.y - 6);

  // wynik i czas
  ctx.shadowColor = '#000'; ctx.shadowBlur = 6;
  ctx.textBaseline = 'top';
  ctx.textAlign = 'left';
  fitFont('Ubite: ' + score, Math.min(30, W * 0.07), W / 2 - pad);
  ctx.fillStyle = '#f0f0f0';
  ctx.fillText('Ubite: ' + score, pad, top);
  ctx.textAlign = 'right';
  fitFont(formatTime(elapsed), Math.min(26, W * 0.06), W / 2 - pad);
  ctx.fillText(formatTime(elapsed), W - pad, top + 2);
  ctx.shadowBlur = 0;
  ctx.restore();

  // przyciski broni
  drawButton(UI.btnL, weapon === 'garlic', 'Czosnek ' + ammo + '/' + CFG.maxAmmo,
    (r) => garlicShape(ctx, r * 0.9, -0.2), ammoBlink);
  drawButton(UI.btnR, weapon === 'spear', 'Dzida',
    (r) => {
      ctx.save(); ctx.rotate(-Math.PI / 4);
      ctx.fillStyle = '#555'; ctx.fillRect(-r * 1.3, -r * 0.08, r * 1.6, r * 0.16);
      ctx.fillStyle = '#e0e0e0';
      ctx.beginPath(); ctx.moveTo(r * 0.3, -r * 0.22); ctx.lineTo(r * 1.3, 0); ctx.lineTo(r * 0.3, r * 0.22); ctx.closePath(); ctx.fill();
      ctx.restore();
    }, 0);
  // pasek odnawiania czosnku
  if (ammo < CFG.maxAmmo) {
    const b = UI.btnL;
    ctx.fillStyle = 'rgba(220,220,220,0.6)';
    ctx.fillRect(b.x + 10, b.y + b.h - 6, (b.w - 20) * (ammoTimer / CFG.ammoRegen), 2);
  }
}

function drawCenterText(lines, startY) {
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = '#000'; ctx.shadowBlur = 14;
  let y = startY;
  const maxW = W - UI.pad * 3;
  for (const [txt, size, color, fam] of lines) {
    const s = txt ? fitFont(txt, size, maxW, fam || FONT) : size;
    y += s;
    if (txt) { ctx.fillStyle = color; ctx.fillText(txt, W / 2, y); }
    y += s * 0.3;
  }
  ctx.restore();
}

// ---------- Pętla ----------
function gameOver() {
  state = 'over';
  overTime = performance.now();
  sfx.death();
  if (score > best) { best = score; try { localStorage.setItem('nocNietoperzyBest', best); } catch (e) {} }
}

let last = performance.now();
let menuBatTimer = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (state === 'play') {
    elapsed += dt;
    spawnTimer -= dt;
    if (spawnTimer <= 0) { spawnBat(); spawnTimer = difficulty().interval * rand(0.6, 1.4); }
    if (ammo < CFG.maxAmmo) {
      ammoTimer += dt;
      if (ammoTimer >= CFG.ammoRegen) { ammoTimer = 0; ammo++; }
    } else ammoTimer = 0;
  } else if (state === 'menu') {
    menuBatTimer -= dt;
    if (menuBatTimer <= 0 && bats.length < 6) { spawnBat(); menuBatTimer = 1.2; }
  }
  ammoBlink = Math.max(0, ammoBlink - dt * 2);

  for (const b of bats) updateBat(b, dt);
  if (state === 'menu') bats = bats.filter(b => b.z > 10 || b.state === 'dead');
  bats = bats.filter(b => !(b.state === 'dead' && (b.alpha <= 0 || b.y < -6)));
  updateGarlics(dt);
  updateParticles(dt);
  flash = Math.max(0, flash - dt * 3.2);
  shake = Math.max(0, shake - dt * 5);

  ctx.save();
  if (shake > 0) ctx.translate(rand(-1, 1) * 12 * shake, rand(-1, 1) * 12 * shake);
  ctx.drawImage(bgCanvas, -16, -16, W + 32, H + 32);
  drawClouds(dt);

  const drawables = [];
  for (const b of bats) drawables.push({ z: b.z, d: () => drawBat(b) });
  for (const g of garlics) drawables.push({ z: g.z, d: () => drawGarlic(g) });
  drawables.sort((a, b) => b.z - a.z);
  for (const o of drawables) o.d();
  drawParticles();
  if (state === 'play') {
    if (weapon === 'spear') drawSpear(dt);
    else { spear.t = 1; drawHeldGarlic(); }
  }
  ctx.restore();

  // ugryzienie — jedyny kolor w grze
  if (flash > 0) {
    ctx.fillStyle = 'rgba(200,0,10,' + (0.55 * flash) + ')';
    ctx.fillRect(0, 0, W, H);
    const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.2, W / 2, H / 2, Math.max(W, H) * 0.7);
    v.addColorStop(0, 'rgba(120,0,0,0)');
    v.addColorStop(1, 'rgba(130,0,0,' + (0.85 * flash) + ')');
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  }
  // przy niskim zdrowiu ekran ciemnieje od brzegów
  if (state === 'play' && health <= 3) {
    const pulse = 0.45 + 0.2 * Math.sin(now / 200);
    const v = ctx.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.3, W / 2, H * 0.45, Math.max(W, H) * 0.7);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(0,0,0,' + pulse + ')');
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  }

  if (state === 'play') drawHUD();
  else if (state === 'menu') {
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(0, 0, W, H);
    drawCenterText([
      ['Noc', 90, '#f0f0f0', FONT_TITLE],
      ['Nietoperzy', 90, '#f0f0f0', FONT_TITLE],
      ['Transylwania, północ…', 28, '#a0a0a0'],
      ['', 18],
      ['Czosnek — rzut po łuku, zapas się odnawia', 24, '#d8d8d8'],
      ['Dzida — tylko gdy nietoperz jest blisko', 24, '#d8d8d8'],
      ['Broń zmieniasz przyciskami na dole', 24, '#d8d8d8'],
      ['Nie daj się ugryźć dziesięć razy!', 24, '#d8d8d8'],
      ['', 18],
      ['Dotknij, aby zacząć', 40, '#ffffff'],
    ].concat(best ? [['Rekord: ' + best, 22, '#8a8a8a']] : []), H * 0.2);
  } else if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, W, H);
    const canRestart = now - overTime > 1200;
    drawCenterText([
      ['Nie żyjesz', 84, '#ffffff'],
      ['', 10],
      ['Ubite nietoperze: ' + score, 34, '#e0e0e0'],
      ['Czas: ' + formatTime(elapsed), 26, '#a8a8a8'],
      ['Rekord: ' + best, 26, '#a8a8a8'],
      ['', 20],
      [canRestart ? 'Dotknij, aby zagrać ponownie' : '', 34, '#ffffff'],
    ], H * 0.28);
  }

  requestAnimationFrame(frame);
}

// ---------- Wejście ----------
function inRect(x, y, r) { return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }
function selectWeapon(w) {
  if (weapon !== w) { weapon = w; sfx.select(); }
}

cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  initAudio();
  const r = cv.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  if (state === 'menu') { resetGame(); state = 'play'; return; }
  if (state === 'over') {
    if (performance.now() - overTime > 1200) { resetGame(); state = 'play'; }
    return;
  }
  if (y >= UI.hp.y - 20) {
    // strefa przycisków: lewa połowa = czosnek, prawa = dzida
    if (y >= UI.btnL.y - 6) selectWeapon(x < W / 2 ? 'garlic' : 'spear');
    return;
  }
  if (weapon === 'garlic') throwGarlic(x, y);
  else thrustSpear(x, y);
}, { passive: false });

window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === '1') selectWeapon('garlic');
  if (e.key === 'ArrowRight' || e.key === '2') selectWeapon('spear');
});
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
window.addEventListener('resize', resize);

resize();
requestAnimationFrame(frame);
</script>
</body>
