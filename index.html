<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05060d">
<title>Noc Nietoperzy</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #05060d;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* =========================================================================
   NOC NIETOPERZY — FPP, stała pozycja gracza. Nietoperze lecą z głębi lasu,
   gracz rzuca pomidorami (lot po łuku). 10 ugryzień = śmierć.
   ========================================================================= */

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- Konfiguracja ----------
const CFG = {
  maxHealth: 10,
  gravity: 9.8,            // j/s^2
  tomatoSpeed: 20,         // przybliżona prędkość pomidora (do liczenia czasu lotu)
  tomatoRadius: 0.09,
  hand: { x: 0.18, y: -0.38, z: 0.25 }, // skąd wylatuje pomidor
  spawnZ: 42,
  hoverZ: 1.15,            // odległość, z której nietoperz kąsa
  lungeZ: 0.5,             // jak blisko podlatuje w chwili ugryzienia
  lungeTime: 0.24,         // czas "rzutu" paszczą przed ugryzieniem
  biteMin: 0.5, biteMax: 0.8,
  batHitRadius: 0.36,
};

// ---------- Ekran / projekcja ----------
let W = 0, H = 0, DPR = 1, F = 1, CX = 0, CY = 0;
let bgCanvas = null;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  F = Math.min(W, H) * 0.95;
  CX = W / 2; CY = H * 0.5;
  buildBackground();
  buildClouds();
}

function project(x, y, z) {
  return { x: CX + (x / z) * F, y: CY - (y / z) * F, s: F / z };
}

// ---------- Pomocnicze ----------
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
function seeded(seed) {
  let s = seed >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

// ---------- Tło (prerender) ----------
let moon = { x: 0, y: 0, r: 0 };

function buildBackground() {
  bgCanvas = document.createElement('canvas');
  bgCanvas.width = Math.round(W * DPR); bgCanvas.height = Math.round(H * DPR);
  const g = bgCanvas.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const R = seeded(1337);
  const horizon = H * 0.58;

  // Niebo
  const sky = g.createLinearGradient(0, 0, 0, horizon);
  sky.addColorStop(0, '#03040c');
  sky.addColorStop(0.45, '#0b1233');
  sky.addColorStop(0.85, '#2a1d45');
  sky.addColorStop(1, '#4a2c4c');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);

  // Gwiazdy
  const starCount = Math.round(W * H / 2500);
  for (let i = 0; i < starCount; i++) {
    const x = R() * W, y = Math.pow(R(), 1.6) * horizon;
    const r = R() < 0.06 ? 1.4 : R() * 0.9 + 0.2;
    g.globalAlpha = 0.25 + R() * 0.75 * (1 - y / horizon);
    g.fillStyle = R() < 0.15 ? '#ffe9c9' : '#dfe6ff';
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }
  g.globalAlpha = 1;

  // Księżyc
  moon.r = Math.min(W, H) * 0.085;
  moon.x = W * 0.76; moon.y = H * 0.17;
  let glow = g.createRadialGradient(moon.x, moon.y, moon.r * 0.8, moon.x, moon.y, moon.r * 6);
  glow.addColorStop(0, 'rgba(255,245,215,0.35)');
  glow.addColorStop(0.3, 'rgba(200,200,255,0.10)');
  glow.addColorStop(1, 'rgba(120,120,200,0)');
  g.fillStyle = glow; g.fillRect(0, 0, W, H);
  const mg = g.createRadialGradient(moon.x - moon.r * 0.3, moon.y - moon.r * 0.3, moon.r * 0.1, moon.x, moon.y, moon.r);
  mg.addColorStop(0, '#fffbea'); mg.addColorStop(0.7, '#f1e8c8'); mg.addColorStop(1, '#d8cda6');
  g.fillStyle = mg;
  g.beginPath(); g.arc(moon.x, moon.y, moon.r, 0, Math.PI * 2); g.fill();
  // kratery
  g.save();
  g.beginPath(); g.arc(moon.x, moon.y, moon.r, 0, Math.PI * 2); g.clip();
  const craters = [[-0.3, -0.2, 0.22], [0.25, 0.1, 0.16], [-0.05, 0.38, 0.13], [0.35, -0.35, 0.09], [-0.45, 0.25, 0.1], [0.05, -0.05, 0.07]];
  for (const [cx, cy, cr] of craters) {
    g.fillStyle = 'rgba(160,145,110,0.35)';
    g.beginPath(); g.arc(moon.x + cx * moon.r, moon.y + cy * moon.r, cr * moon.r, 0, Math.PI * 2); g.fill();
    g.fillStyle = 'rgba(255,255,240,0.25)';
    g.beginPath(); g.arc(moon.x + cx * moon.r + cr * moon.r * 0.2, moon.y + cy * moon.r + cr * moon.r * 0.2, cr * moon.r * 0.7, 0, Math.PI * 2); g.fill();
  }
  g.restore();

  // Góry — 3 warstwy
  const layers = [
    { base: horizon - H * 0.20, amp: H * 0.16, color: '#2a2342', freq: 1.0, seed: 3 },
    { base: horizon - H * 0.10, amp: H * 0.13, color: '#1b1731', freq: 1.7, seed: 7 },
    { base: horizon - H * 0.03, amp: H * 0.08, color: '#120f22', freq: 2.6, seed: 11 },
  ];
  let castleSpot = null;
  layers.forEach((L, li) => {
    const r = seeded(L.seed * 977);
    const ph = [r() * 10, r() * 10, r() * 10, r() * 10];
    const ridge = (x) => {
      const u = x / W * Math.PI * 2 * L.freq;
      let v = 0.55 * (1 - Math.abs(Math.sin(u * 0.8 + ph[0])))
            + 0.30 * (1 - Math.abs(Math.sin(u * 1.9 + ph[1])))
            + 0.12 * Math.sin(u * 5.3 + ph[2])
            + 0.05 * Math.sin(u * 13.7 + ph[3]);
      return L.base - v * L.amp;
    };
    // śnieg/poświata księżyca na grzbietach
    g.fillStyle = L.color;
    g.beginPath(); g.moveTo(0, H);
    let best = { x: 0, y: H };
    for (let x = 0; x <= W + 4; x += 4) {
      const y = ridge(x) + (r() - 0.5) * 2;
      g.lineTo(x, y);
      if (li === 1 && x > W * 0.12 && x < W * 0.5 && y < best.y) best = { x, y };
    }
    g.lineTo(W, H); g.closePath(); g.fill();
    // delikatne podświetlenie krawędzi
    g.strokeStyle = li === 0 ? 'rgba(190,180,230,0.25)' : 'rgba(160,150,210,0.12)';
    g.lineWidth = 1.2;
    g.beginPath();
    for (let x = 0; x <= W + 4; x += 4) { const y = ridge(x); x === 0 ? g.moveTo(x, y) : g.lineTo(x, y); }
    g.stroke();
    if (li === 1) castleSpot = best;
    // mgła między warstwami
    const mist = g.createLinearGradient(0, L.base - L.amp * 0.2, 0, horizon + 10);
    mist.addColorStop(0, 'rgba(120,100,160,0)');
    mist.addColorStop(1, 'rgba(120,100,160,0.10)');
    g.fillStyle = mist; g.fillRect(0, L.base - L.amp * 0.3, W, horizon - L.base + L.amp);
  });

  // Zamek na szczycie
  if (castleSpot) drawCastle(g, castleSpot.x, castleSpot.y + 2, Math.min(W, H) * 0.0011);

  // Las — rzędy świerków
  const rows = [
    { y: horizon - H * 0.005, h: H * 0.07, color: '#0d0f1d', gap: 0.35 },
    { y: horizon + H * 0.04, h: H * 0.11, color: '#0a0b17', gap: 0.4 },
    { y: horizon + H * 0.11, h: H * 0.17, color: '#070811', gap: 0.45 },
    { y: horizon + H * 0.22, h: H * 0.26, color: '#04050b', gap: 0.5 },
  ];
  rows.forEach((row, ri) => {
    const r = seeded(100 + ri * 31);
    g.fillStyle = row.color;
    g.fillRect(0, row.y, W, H - row.y);
    let x = -row.h * 0.3;
    while (x < W + row.h * 0.3) {
      const th = row.h * (0.6 + r() * 0.6);
      const tw = th * (0.28 + r() * 0.12);
      drawPine(g, x, row.y + row.h * 0.1 * r(), tw, th, r);
      x += tw * (row.gap + r() * 0.5);
    }
    // mgła nad rzędem
    const fog = g.createLinearGradient(0, row.y - row.h, 0, row.y + row.h * 0.3);
    fog.addColorStop(0, 'rgba(110,100,150,0)');
    fog.addColorStop(0.7, 'rgba(110,100,150,' + (0.08 - ri * 0.015) + ')');
    fog.addColorStop(1, 'rgba(110,100,150,0)');
    g.fillStyle = fog; g.fillRect(0, row.y - row.h, W, row.h * 1.3);
  });

  // Winieta
  const vig = g.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.3, W / 2, H * 0.5, Math.max(W, H) * 0.8);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.55)');
  g.fillStyle = vig; g.fillRect(0, 0, W, H);
}

function drawPine(g, x, baseY, w, h, r) {
  const tiers = 5;
  g.beginPath();
  g.moveTo(x, baseY - h);
  for (let i = 1; i <= tiers; i++) {
    const t = i / tiers;
    const yy = baseY - h + h * t * 0.92;
    const ww = w * (0.25 + 0.75 * t) * (0.9 + r() * 0.2);
    g.lineTo(x + ww * 0.5, yy);
    if (i < tiers) g.lineTo(x + ww * 0.22, yy - h * 0.04);
  }
  g.lineTo(x + w * 0.06, baseY);
  g.lineTo(x - w * 0.06, baseY);
  for (let i = tiers; i >= 1; i--) {
    const t = i / tiers;
    const yy = baseY - h + h * t * 0.92;
    const ww = w * (0.25 + 0.75 * t) * (0.9 + r() * 0.2);
    if (i < tiers) g.lineTo(x - ww * 0.22, yy - h * 0.04);
    g.lineTo(x - ww * 0.5, yy);
  }
  g.closePath();
  g.fill();
}

function drawCastle(g, x, y, s) {
  g.save();
  g.translate(x, y);
  g.scale(s * 40, s * 40);
  g.fillStyle = '#0c0a18';
  // mur
  g.fillRect(-1.6, -1.2, 3.2, 1.3);
  // blanki
  for (let i = -1.6; i < 1.6; i += 0.32) g.fillRect(i, -1.42, 0.18, 0.24);
  const tower = (tx, tw, th) => {
    g.fillRect(tx - tw / 2, -th, tw, th);
    g.beginPath();
    g.moveTo(tx - tw * 0.7, -th);
    g.lineTo(tx, -th - tw * 1.8);
    g.lineTo(tx + tw * 0.7, -th);
    g.closePath(); g.fill();
  };
  tower(-1.5, 0.55, 2.0);
  tower(1.45, 0.5, 1.8);
  tower(0.2, 0.7, 2.9);
  tower(-0.55, 0.4, 2.2);
  // okna
  g.fillStyle = '#ffcf6a';
  g.shadowColor = '#ffb030'; g.shadowBlur = 6;
  g.fillRect(0.12, -2.3, 0.14, 0.22);
  g.fillRect(-1.55, -1.5, 0.1, 0.16);
  g.fillRect(1.4, -1.2, 0.1, 0.15);
  g.restore();
}

// ---------- Chmury (rysowane na żywo, przesuwają się) ----------
let clouds = [];
function buildClouds() {
  clouds = [];
  const R = seeded(42);
  for (let i = 0; i < 5; i++) {
    const c = document.createElement('canvas');
    const cw = Math.round(Math.min(W, 900) * (0.35 + R() * 0.3)), ch = Math.round(cw * 0.25);
    c.width = cw; c.height = ch;
    const g = c.getContext('2d');
    for (let k = 0; k < 14; k++) {
      const ex = cw * (0.15 + R() * 0.7), ey = ch * (0.4 + R() * 0.3);
      const er = ch * (0.15 + R() * 0.3);
      const gr = g.createRadialGradient(ex, ey, 0, ex, ey, er);
      gr.addColorStop(0, 'rgba(150,140,190,0.18)');
      gr.addColorStop(1, 'rgba(150,140,190,0)');
      g.fillStyle = gr;
      g.beginPath(); g.ellipse(ex, ey, er * 2.2, er, 0, 0, Math.PI * 2); g.fill();
    }
    clouds.push({ img: c, x: R() * W, y: H * (0.05 + R() * 0.3), v: 4 + R() * 8 });
  }
}
function drawClouds(dt) {
  for (const c of clouds) {
    c.x += c.v * dt;
    if (c.x > W + 50) c.x = -c.img.width - 50;
    ctx.drawImage(c.img, c.x, c.y);
  }
}

// ---------- Dźwięk (WebAudio, syntezowany) ----------
let AC = null, noiseBuf = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function noise(dur, type, f0, f1, vol) {
  if (!AC) return;
  const t = AC.currentTime;
  const src = AC.createBufferSource(); src.buffer = noiseBuf;
  const flt = AC.createBiquadFilter(); flt.type = type;
  flt.frequency.setValueAtTime(f0, t);
  flt.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const gn = AC.createGain();
  gn.gain.setValueAtTime(vol, t);
  gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(flt); flt.connect(gn); gn.connect(AC.destination);
  src.start(t); src.stop(t + dur);
}
function tone(f0, f1, dur, vol, type = 'sine') {
  if (!AC) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const gn = AC.createGain();
  gn.gain.setValueAtTime(vol, t);
  gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(gn); gn.connect(AC.destination);
  o.start(t); o.stop(t + dur);
}
const sfx = {
  throw: () => noise(0.12, 'bandpass', 600, 2500, 0.12),
  splat: () => { noise(0.18, 'lowpass', 1800, 200, 0.5); tone(220, 70, 0.12, 0.2, 'triangle'); },
  squeak: () => tone(rand(2600, 3400), rand(1800, 2200), 0.08, 0.05, 'square'),
  bite: () => { tone(120, 40, 0.25, 0.6, 'sawtooth'); noise(0.15, 'highpass', 3000, 900, 0.35); },
  death: () => { tone(300, 40, 1.2, 0.4, 'sawtooth'); },
};

// ---------- Stan gry ----------
let state = 'menu';      // 'menu' | 'play' | 'over'
let bats = [], tomatoes = [], particles = [];
let health, score, elapsed, spawnTimer, flash, shake, overTime, thrown, best = 0;
try { best = +localStorage.getItem('nocNietoperzyBest') || 0; } catch (e) {}

function resetGame() {
  bats = []; tomatoes = []; particles = [];
  health = CFG.maxHealth; score = 0; elapsed = 0; spawnTimer = 0.6;
  flash = 0; shake = 0; thrown = 0;
}
resetGame();

function difficulty() {
  // poziom rośnie z czasem
  const t = elapsed;
  return {
    interval: Math.max(0.17, 1 / (1 + t / 22)),      // 1 nietoperz/s na początku
    speed: Math.min(13, 5.5 + t * 0.045),             // jednostek/s
  };
}

// ---------- Nietoperze ----------
function spawnBat() {
  const d = difficulty();
  const z0 = CFG.spawnZ * rand(0.85, 1.1);
  const b = {
    x0: rand(-16, 16), y0: rand(0.5, 7), z0,
    tx: rand(-0.6, 0.6), ty: rand(-0.22, 0.28),
    x: 0, y: 0, z: z0, vx: 0, vy: 0, vz: 0,
    speed: d.speed * rand(0.8, 1.2),
    size: rand(0.9, 1.15),
    flap: rand(0, Math.PI * 2), flapSpeed: rand(15, 20),
    wobA: rand(0.5, 1.6), wobF: rand(1.2, 2.5), wobP: rand(0, 6.28),
    state: 'fly', biteT: 0, lunge: 0, mouth: 0, tilt: 0, rot: 0,
    alpha: 1, splat: false, squeaked: false,
  };
  b.x = b.x0; b.y = b.y0;
  bats.push(b);
}

function updateBat(b, dt) {
  const px = b.x, py = b.y, pz = b.z;
  b.flap += b.flapSpeed * dt;

  if (b.state === 'fly') {
    b.z -= b.speed * dt * (b.z < 6 ? 0.75 : 1);
    const p = clamp(1 - (b.z - CFG.hoverZ) / (b.z0 - CFG.hoverZ), 0, 1);
    const e = p * p * (3 - 2 * p);
    const wob = Math.min(1, (b.z - CFG.hoverZ) / 8);
    b.x = lerp(b.x0, b.tx, e) + Math.sin(elapsed * b.wobF + b.wobP) * b.wobA * wob;
    b.y = lerp(b.y0, b.ty, e) + Math.cos(elapsed * b.wobF * 1.3 + b.wobP) * b.wobA * 0.5 * wob + Math.sin(b.flap) * 0.04;
    b.mouth = clamp((7 - b.z) / 5, 0, 0.55);
    if (!b.squeaked && b.z < 8) { b.squeaked = true; sfx.squeak(); }
    if (b.z <= CFG.hoverZ) {
      b.z = CFG.hoverZ;
      b.state = 'attack';
      b.biteT = rand(0.35, 0.6);
    }
  } else if (b.state === 'attack') {
    b.biteT -= dt;
    b.lunge = clamp(1 - b.biteT / CFG.lungeTime, 0, 1);
    const l = b.lunge * b.lunge;
    b.z = lerp(CFG.hoverZ, CFG.lungeZ, l);
    b.x = b.tx * lerp(1, 0.35, l) + Math.sin(elapsed * 3 + b.wobP) * 0.05;
    b.y = b.ty * lerp(1, 0.4, l) + Math.sin(b.flap) * 0.03 - l * 0.05;
    b.mouth = Math.max(0.55, b.lunge);
    if (b.biteT <= 0) {
      bite(b);
      b.biteT = rand(CFG.biteMin, CFG.biteMax);
      b.lunge = 0;
    }
  } else if (b.state === 'dead') {
    b.vy -= CFG.gravity * dt;
    b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
    b.rot += b.spin * dt;
    b.mouth = 0.3;
    b.alpha -= dt * 0.6;
    return;
  }
  if (dt > 0) { b.vx = (b.x - px) / dt; b.vy = (b.y - py) / dt; b.vz = (b.z - pz) / dt; }
  b.tilt = clamp(b.vx * 0.04, -0.4, 0.4);
}

function bite(b) {
  if (state !== 'play') return;
  health--;
  flash = 1;
  shake = 1;
  sfx.bite();
  if (health <= 0) gameOver();
}

function killBat(b, tom) {
  b.state = 'dead';
  b.splat = true;
  b.vx = tom.vx * 0.15 + rand(-1, 1);
  b.vy = Math.max(1, tom.vy * 0.1) + rand(0.5, 2);
  b.vz = Math.max(0.5, tom.vz * 0.2);
  b.spin = rand(-8, 8);
  score++;
  sfx.splat();
  const p = project(b.x, b.y, b.z);
  const s = p.s;
  for (let i = 0; i < 26; i++) {
    const a = rand(0, Math.PI * 2), v = rand(0.4, 2.2) * s;
    particles.push({
      x: p.x, y: p.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - s * 0.5,
      g: s * 4, r: rand(0.015, 0.05) * s, life: rand(0.4, 0.9), t: 0,
      c: Math.random() < 0.8 ? '#d0141c' : '#ffd23a',
    });
  }
}

// ---------- Pomidory ----------
function throwTomato(sx, sy) {
  thrown++;
  sfx.throw();
  const S = CFG.hand;
  // Szukamy nietoperza pod palcem / kursorem
  let target = null, bestScore = Infinity;
  for (const b of bats) {
    if (b.state === 'dead') continue;
    const p = project(b.x, b.y, b.z);
    const r = p.s * 0.5 * b.size * 0.75 + 26;
    const d = Math.hypot(p.x - sx, p.y - sy);
    if (d < r) {
      const sc = d / r + (b.state === 'attack' ? -0.3 : 0);
      if (sc < bestScore) { bestScore = sc; target = b; }
    }
  }
  let T, t;
  if (target) {
    const base = target.state === 'attack'
      ? { x: target.tx, y: target.ty, z: CFG.hoverZ }
      : { x: target.x, y: target.y, z: target.z };
    const dist = Math.hypot(base.x - S.x, base.y - S.y, base.z - S.z);
    t = clamp(dist / CFG.tomatoSpeed, 0.09, 1.4);
    if (target.state === 'attack') T = base;
    else {
      // przewidywanie pozycji (iteracyjnie)
      T = base;
      for (let k = 0; k < 3; k++) {
        T = { x: base.x + target.vx * t, y: base.y + target.vy * t, z: Math.max(CFG.hoverZ, base.z + target.vz * t) };
        t = clamp(Math.hypot(T.x - S.x, T.y - S.y, T.z - S.z) / CFG.tomatoSpeed, 0.09, 1.4);
      }
    }
  } else {
    const dx = (sx - CX) / F, dy = -(sy - CY) / F;
    const D = 18;
    T = { x: dx * D, y: dy * D, z: D };
    t = Math.hypot(T.x - S.x, T.y - S.y, T.z - S.z) / CFG.tomatoSpeed;
  }
  tomatoes.push({
    x: S.x, y: S.y, z: S.z,
    vx: (T.x - S.x) / t,
    vy: (T.y - S.y) / t + 0.5 * CFG.gravity * t,
    vz: (T.z - S.z) / t,
    rot: rand(0, 6.28), spin: rand(-12, 12), age: 0,
  });
}

function updateTomatoes(dt) {
  const steps = 4, h = dt / steps;
  for (let i = tomatoes.length - 1; i >= 0; i--) {
    const tm = tomatoes[i];
    let hit = false;
    for (let s = 0; s < steps && !hit; s++) {
      tm.vy -= CFG.gravity * h;
      tm.x += tm.vx * h; tm.y += tm.vy * h; tm.z += tm.vz * h;
      for (const b of bats) {
        if (b.state === 'dead') continue;
        const rr = CFG.batHitRadius * b.size + CFG.tomatoRadius;
        const dx = tm.x - b.x, dy = tm.y - b.y, dz = (tm.z - b.z) * 0.8;
        if (dx * dx + dy * dy + dz * dz < rr * rr) { killBat(b, tm); hit = true; break; }
      }
    }
    tm.rot += tm.spin * dt;
    tm.age += dt;
    if (hit || tm.y < -4 || tm.z > 90 || tm.age > 5) {
      if (!hit && tm.y < -4 && tm.z > 2 && tm.z < 40) {
        // rozbity o ziemię — mały rozprysk
        const p = project(tm.x, -1.6, tm.z);
        if (p.y < H) for (let k = 0; k < 6; k++) particles.push({
          x: p.x, y: Math.min(p.y, H - 2), vx: rand(-1, 1) * p.s, vy: -rand(0.3, 1) * p.s,
          g: p.s * 4, r: rand(0.02, 0.05) * p.s, life: 0.4, t: 0, c: '#b01018',
        });
      }
      tomatoes.splice(i, 1);
    }
  }
}

// ---------- Rysowanie nietoperza ----------
function drawBat(b) {
  if (b.z < 0.2) return;
  const p = project(b.x, b.y, b.z);
  const s = p.s * 0.5 * b.size;
  if (s < 1.5) {
    ctx.fillStyle = '#05030a';
    ctx.fillRect(p.x - 1.5, p.y - 1, 3, 2);
    return;
  }
  const f = Math.sin(b.flap);
  ctx.save();
  ctx.globalAlpha = clamp(b.alpha, 0, 1);
  ctx.translate(p.x, p.y);
  ctx.rotate(b.tilt + b.rot);
  ctx.scale(s, s);

  // Skrzydła
  const tipY = -0.55 * f, midY = -0.25 * f;
  for (const side of [-1, 1]) {
    ctx.save();
    ctx.scale(side, 1);
    const tip = [1.0, -0.1 + tipY];
    const f1 = [0.72, 0.18 + midY * 0.7];
    const f2 = [0.45, 0.26 + midY * 0.35];
    const root = [0.13, 0.22];
    ctx.beginPath();
    ctx.moveTo(0.1, -0.12);
    ctx.quadraticCurveTo(0.45, -0.42 + midY * 1.2, tip[0], tip[1]);
    ctx.quadraticCurveTo((tip[0] + f1[0]) / 2 - 0.02, (tip[1] + f1[1]) / 2 - 0.02, f1[0], f1[1]);
    ctx.quadraticCurveTo((f1[0] + f2[0]) / 2, (f1[1] + f2[1]) / 2 - 0.1, f2[0], f2[1]);
    ctx.quadraticCurveTo((f2[0] + root[0]) / 2, (f2[1] + root[1]) / 2 - 0.1, root[0], root[1]);
    ctx.closePath();
    ctx.fillStyle = '#1d1226';
    ctx.fill();
    ctx.strokeStyle = 'rgba(170,150,220,0.35)';
    ctx.lineWidth = Math.max(0.012, 1 / s);
    ctx.stroke();
    // kości palców
    if (s > 12) {
      ctx.strokeStyle = 'rgba(90,70,110,0.9)';
      ctx.lineWidth = Math.max(0.01, 0.8 / s);
      ctx.beginPath();
      ctx.moveTo(0.12, -0.1); ctx.lineTo(0.45, -0.3 + midY);
      ctx.lineTo(tip[0], tip[1]);
      ctx.moveTo(0.45, -0.3 + midY); ctx.lineTo(f1[0], f1[1]);
      ctx.moveTo(0.45, -0.3 + midY); ctx.lineTo(f2[0], f2[1]);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Ciało
  ctx.fillStyle = '#140b18';
  ctx.beginPath(); ctx.ellipse(0, 0.06, 0.15, 0.24, 0, 0, Math.PI * 2); ctx.fill();
  // Uszy
  ctx.beginPath();
  ctx.moveTo(-0.15, -0.22); ctx.lineTo(-0.2, -0.48); ctx.lineTo(-0.04, -0.3);
  ctx.moveTo(0.15, -0.22); ctx.lineTo(0.2, -0.48); ctx.lineTo(0.04, -0.3);
  ctx.fill();
  // Głowa
  ctx.beginPath(); ctx.arc(0, -0.16, 0.18, 0, Math.PI * 2); ctx.fill();
  if (s > 10) {
    ctx.strokeStyle = 'rgba(170,150,220,0.25)';
    ctx.lineWidth = Math.max(0.01, 1 / s);
    ctx.beginPath(); ctx.arc(0, -0.16, 0.18, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  }

  // Oczy (świecą)
  const eyeR = 0.03;
  for (const ex of [-0.07, 0.07]) {
    const gl = ctx.createRadialGradient(ex, -0.21, 0, ex, -0.21, eyeR * 3.5);
    gl.addColorStop(0, 'rgba(255,40,30,0.9)');
    gl.addColorStop(1, 'rgba(255,0,0,0)');
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(ex, -0.21, eyeR * 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffdd55';
    ctx.beginPath(); ctx.arc(ex, -0.21, eyeR, 0, Math.PI * 2); ctx.fill();
  }

  // Paszcza z zębami
  const m = b.mouth;
  if (m > 0.05 && s > 6) {
    const mx = 0, my = -0.09;
    const rw = 0.06 + 0.07 * m, rh = 0.012 + 0.09 * m;
    ctx.fillStyle = '#5a0614';
    ctx.beginPath(); ctx.ellipse(mx, my + rh * 0.4, rw, rh, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#25000a';
    ctx.beginPath(); ctx.ellipse(mx, my + rh * 0.55, rw * 0.7, rh * 0.65, 0, 0, Math.PI * 2); ctx.fill();
    // język
    if (m > 0.4) {
      ctx.fillStyle = '#a0203a';
      ctx.beginPath(); ctx.ellipse(mx, my + rh * 1.0, rw * 0.45, rh * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    }
    const top = my + rh * 0.4 - rh, bot = my + rh * 0.4 + rh;
    ctx.fillStyle = '#f6f3e8';
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = Math.max(0.004, 0.6 / s);
    // kły górne
    const fang = 0.035 + 0.06 * m;
    for (const fx of [-0.6, 0.6]) {
      ctx.beginPath();
      ctx.moveTo(mx + fx * rw - 0.018, top + rh * 0.12);
      ctx.lineTo(mx + fx * rw, top + rh * 0.12 + fang);
      ctx.lineTo(mx + fx * rw + 0.018, top + rh * 0.12);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    // małe zęby górne
    for (let i = -3; i <= 3; i++) {
      if (Math.abs(i) === 2 || i === 0) {
        const tx = mx + (i / 3.4) * rw;
        ctx.beginPath();
        ctx.moveTo(tx - 0.01, top + rh * 0.18);
        ctx.lineTo(tx, top + rh * 0.18 + fang * 0.35);
        ctx.lineTo(tx + 0.01, top + rh * 0.18);
        ctx.closePath(); ctx.fill();
      }
    }
    // kły dolne
    for (const fx of [-0.4, 0.4]) {
      ctx.beginPath();
      ctx.moveTo(mx + fx * rw - 0.014, bot - rh * 0.12);
      ctx.lineTo(mx + fx * rw, bot - rh * 0.12 - fang * 0.7);
      ctx.lineTo(mx + fx * rw + 0.014, bot - rh * 0.12);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  }

  // Plama z pomidora
  if (b.splat) {
    ctx.fillStyle = 'rgba(205,20,28,0.9)';
    ctx.beginPath(); ctx.arc(0.02, -0.05, 0.16, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(-0.12, 0.05, 0.07, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0.14, -0.15, 0.06, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,210,60,0.9)';
    ctx.beginPath(); ctx.arc(0.0, -0.06, 0.02, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0.06, -0.02, 0.015, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawTomato(tm) {
  if (tm.z < 0.15) return;
  const p = project(tm.x, tm.y, tm.z);
  const r = CFG.tomatoRadius * p.s;
  if (p.y - r > H + 50) return;
  ctx.save();
  ctx.translate(p.x, p.y);
  if (r < 1.2) { ctx.fillStyle = '#e0241c'; ctx.fillRect(-1, -1, 2, 2); ctx.restore(); return; }
  const g = ctx.createRadialGradient(-r * 0.35, -r * 0.35, r * 0.1, 0, 0, r);
  g.addColorStop(0, '#ff7a5a'); g.addColorStop(0.5, '#e3261b'); g.addColorStop(1, '#7a0a08');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(0, 0, r, r * 0.9, 0, 0, Math.PI * 2); ctx.fill();
  ctx.rotate(tm.rot);
  ctx.fillStyle = '#2f8a2a';
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = i / 5 * Math.PI * 2;
    ctx.lineTo(Math.cos(a) * r * 0.5, Math.sin(a) * r * 0.5 - r * 0.6);
    ctx.lineTo(Math.cos(a + 0.6) * r * 0.15, Math.sin(a + 0.6) * r * 0.15 - r * 0.6);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

// ---------- Cząsteczki ----------
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const q = particles[i];
    q.t += dt;
    q.vy += q.g * dt;
    q.x += q.vx * dt; q.y += q.vy * dt;
    if (q.t > q.life) particles.splice(i, 1);
  }
}
function drawParticles() {
  for (const q of particles) {
    ctx.globalAlpha = clamp(1 - q.t / q.life, 0, 1);
    ctx.fillStyle = q.c;
    ctx.beginPath(); ctx.arc(q.x, q.y, Math.max(1, q.r), 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ---------- HUD ----------
function drawHUD() {
  const pad = 16;
  const bw = Math.min(W - pad * 2, 440), bh = 20;
  const bx = (W - bw) / 2, by = H - bh - Math.max(pad, 22);
  ctx.save();
  ctx.font = 'bold 12px Georgia, serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,220,220,0.8)';
  ctx.fillText('ZDROWIE', W / 2, by - 6);
  // ramka
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  roundRect(bx - 3, by - 3, bw + 6, bh + 6, 6); ctx.fill();
  const seg = bw / CFG.maxHealth;
  for (let i = 0; i < CFG.maxHealth; i++) {
    const alive = i < health;
    const sx = bx + i * seg + 1.5;
    if (alive) {
      const g = ctx.createLinearGradient(0, by, 0, by + bh);
      g.addColorStop(0, '#ff5a5a'); g.addColorStop(1, '#8e0c12');
      ctx.fillStyle = g;
    } else ctx.fillStyle = 'rgba(80,20,25,0.5)';
    roundRect(sx, by, seg - 3, bh, 3); ctx.fill();
  }
  // wynik
  ctx.textAlign = 'left';
  ctx.font = 'bold 20px Georgia, serif';
  ctx.fillStyle = '#f3e7d0';
  ctx.shadowColor = '#000'; ctx.shadowBlur = 6;
  ctx.fillText('🦇 ' + score, pad, pad + 18);
  ctx.textAlign = 'right';
  ctx.font = '16px Georgia, serif';
  ctx.fillText(formatTime(elapsed), W - pad, pad + 16);
  ctx.restore();
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function formatTime(t) {
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return m + ':' + String(s).padStart(2, '0');
}

function drawCenterText(lines) {
  ctx.save();
  ctx.textAlign = 'center';
  ctx.shadowColor = '#000'; ctx.shadowBlur = 12;
  let y = H * 0.36;
  for (const [txt, size, color] of lines) {
    ctx.font = 'bold ' + size + 'px Georgia, serif';
    ctx.fillStyle = color;
    ctx.fillText(txt, W / 2, y);
    y += size * 1.35;
  }
  ctx.restore();
}

// ---------- Pętla ----------
function gameOver() {
  state = 'over';
  overTime = performance.now();
  sfx.death();
  if (score > best) { best = score; try { localStorage.setItem('nocNietoperzyBest', best); } catch (e) {} }
}

let last = performance.now();
let menuBatTimer = 0;
function frame(now) {
  let dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (state === 'play') {
    elapsed += dt;
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnBat();
      spawnTimer = difficulty().interval * rand(0.6, 1.4);
    }
  } else if (state === 'menu') {
    // kilka nietoperzy w tle menu, nie atakują
    menuBatTimer -= dt;
    if (menuBatTimer <= 0 && bats.length < 6) { spawnBat(); menuBatTimer = 1.2; }
  }

  for (const b of bats) updateBat(b, dt);
  if (state === 'menu') bats = bats.filter(b => b.z > 10 || b.state === 'dead');
  bats = bats.filter(b => !(b.state === 'dead' && (b.alpha <= 0 || b.y < -6)));
  updateTomatoes(dt);
  updateParticles(dt);
  flash = Math.max(0, flash - dt * 3.2);
  shake = Math.max(0, shake - dt * 5);

  // --- render ---
  ctx.save();
  if (shake > 0) ctx.translate(rand(-1, 1) * 14 * shake, rand(-1, 1) * 14 * shake);
  ctx.drawImage(bgCanvas, -20, -20, W + 40, H + 40);
  drawClouds(dt);

  // sortowanie głębi: daleko -> blisko
  const drawables = [];
  for (const b of bats) drawables.push({ z: b.z, d: () => drawBat(b) });
  for (const t of tomatoes) drawables.push({ z: t.z, d: () => drawTomato(t) });
  drawables.sort((a, b) => b.z - a.z);
  for (const o of drawables) o.d();
  drawParticles();
  ctx.restore();

  // błysk ugryzienia
  if (flash > 0) {
    ctx.fillStyle = 'rgba(190,0,10,' + (0.55 * flash) + ')';
    ctx.fillRect(0, 0, W, H);
    const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.2, W / 2, H / 2, Math.max(W, H) * 0.7);
    v.addColorStop(0, 'rgba(120,0,0,0)');
    v.addColorStop(1, 'rgba(120,0,0,' + (0.8 * flash) + ')');
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  }
  // stała czerwona poświata przy niskim zdrowiu
  if (state === 'play' && health <= 3) {
    const pulse = 0.25 + 0.15 * Math.sin(now / 180);
    const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
    v.addColorStop(0, 'rgba(120,0,0,0)');
    v.addColorStop(1, 'rgba(140,0,0,' + pulse + ')');
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  }

  if (state === 'play') drawHUD();
  else if (state === 'menu') {
    drawCenterText([
      ['NOC NIETOPERZY', Math.min(64, W * 0.11), '#e8d9b5'],
      ['Transylwania, północ…', Math.min(22, W * 0.05), '#b9a7d8'],
      ['', 10, '#fff'],
      ['Dotknij / kliknij, by rzucić pomidorem', Math.min(20, W * 0.045), '#f3e7d0'],
      ['Nie daj się ugryźć 10 razy!', Math.min(20, W * 0.045), '#f3e7d0'],
      ['', 10, '#fff'],
      ['▶  DOTKNIJ, ABY ZACZĄĆ', Math.min(26, W * 0.06), '#ff6b5a'],
    ].concat(best ? [['Rekord: ' + best, 16, '#aaa']] : []));
  } else if (state === 'over') {
    ctx.fillStyle = 'rgba(30,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
    const canRestart = now - overTime > 1200;
    drawCenterText([
      ['NIE ŻYJESZ', Math.min(64, W * 0.12), '#ff4a4a'],
      ['Ustrzelone nietoperze: ' + score, Math.min(24, W * 0.055), '#f3e7d0'],
      ['Czas: ' + formatTime(elapsed) + '   •   Rekord: ' + best, Math.min(18, W * 0.042), '#c8b8a8'],
      ['Celność: ' + (thrown ? Math.round(score / thrown * 100) : 0) + '%', Math.min(18, W * 0.042), '#c8b8a8'],
      ['', 10, '#fff'],
      [canRestart ? '▶  DOTKNIJ, ABY ZAGRAĆ PONOWNIE' : '', Math.min(24, W * 0.052), '#ff6b5a'],
    ]);
    drawHUD();
  }

  requestAnimationFrame(frame);
}

// ---------- Wejście ----------
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  initAudio();
  const r = cv.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  if (state === 'menu') { resetGame(); state = 'play'; return; }
  if (state === 'over') {
    if (performance.now() - overTime > 1200) { resetGame(); state = 'play'; }
    return;
  }
  throwTomato(x, y);
}, { passive: false });
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
window.addEventListener('resize', resize);

resize();
requestAnimationFrame(frame);
</script>
</body>
